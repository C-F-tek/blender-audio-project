name: Regenerate AI Index

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'Scripting/**'
      - 'Tools/**'
      - '.github/workflows/**'
      - '*.py'
      - '*.json'
      - '*.md'
      - '!indexAI/**'

permissions:
  contents: write

concurrency:
  group: regenerate-ai-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-ai-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate project AI index
        run: python Tools/npu/build_project_ai_index.py --force

      - name: Show changed files
        run: git status --short

      - name: Commit regenerated indexes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: regenerate project AI indexes'
          file_pattern: |
            indexAI/README.md
            indexAI/project_code_index.md
            indexAI/project_code_manifest.json
            indexAI/project_code_chunks/**
