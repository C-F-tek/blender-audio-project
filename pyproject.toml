[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-audio-project"
version = "0.0.0"
description = "Workspace for Blender audio-reactive scripting, audio analysis, and AI-assisted visual package workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Carmine Faiola" }
]
dependencies = [
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
  "librosa>=0.10,<0.12",
  "ollama>=0.6,<0.7",
  "openvino>=2026.1,<2026.2",
  "openvino-genai>=2026.1,<2026.2"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pylint>=3.2",
  "bandit>=1.7"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  ".git",
  ".venv",
  ".repo_patch_backups",
  "indexAI",
  "Scripting/v61b_backgood"
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
  "E402"
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
exclude = "(indexAI|Scripting/v61b_backgood|\\.venv|\\.repo_patch_backups)"

[tool.pylint.main]
ignore = [".venv", "indexAI", "v61b_backgood", ".repo_patch_backups"]

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "invalid-name",
  "import-error"
]

[tool.bandit]
exclude_dirs = [".venv", "indexAI", "Scripting/v61b_backgood", ".repo_patch_backups"]
